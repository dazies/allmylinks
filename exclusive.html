<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Content</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .exclusive-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.12);
            border: 2px solid rgba(255, 182, 193, 0.3);
            margin-bottom: 20px;
            animation: fade-in-up 0.8s ease;
        }

        .exclusive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .exclusive-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffb3d9 0%, #ffa3d0 100%);
            color: white;
            padding: 30px 25px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            border: none;
            cursor: pointer;
            gap: 10px;
            min-height: 160px;
        }

        .exclusive-btn icon {
            font-size: 2.5rem;
        }

        .exclusive-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            background: linear-gradient(135deg, #ff99cc 0%, #ff89c3 100%);
        }

        .exclusive-btn:active {
            transform: translateY(-2px);
        }

        .exclusive-btn-icon {
            font-size: 2.5rem;
        }

        .exclusive-btn-label {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.3;
        }

        .exclusive-description {
            font-size: 13px;
            opacity: 0.95;
            margin-top: 5px;
            font-weight: 500;
        }

        .warning-notice {
            background: rgba(255, 182, 193, 0.15);
            border-left: 4px solid #ff69b4;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #ff69b4;
            font-size: 14px;
            line-height: 1.6;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .exclusive-btn {
                padding: 25px 20px;
                min-height: 150px;
            }

            .exclusive-btn-icon {
                font-size: 2rem;
            }

            .exclusive-btn-label {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Exclusive Only 🔐</h1>
        <p class="bio">Welcome to my exclusive 18+ content! Choose where you'd like to go 💋</p>

        <div class="warning-notice">
            ⚠️ By accessing these platforms, you confirm you are 18+ and consent to viewing adult content.
        </div>

        <div class="exclusive-grid">
            <a href="https://onlyfans.com/stormladyy" target="_blank" class="exclusive-btn">
                <span class="exclusive-btn-icon">🔞</span>
                <span class="exclusive-btn-label">OnlyFans<br><span class="exclusive-description">(Paid Content)</span></span>
            </a>

            <a href="https://pantydeal.com/member/Stormlady" target="_blank" class="exclusive-btn">
                <span class="exclusive-btn-icon">💦</span>
                <span class="exclusive-btn-label">PantyDeal<br><span class="exclusive-description">(Custom Wear)</span></span>
            </a>

            <a href="https://www.allthingsworn.com/profile/stormladyy" target="_blank" class="exclusive-btn">
                <span class="exclusive-btn-icon">👙</span>
                <span class="exclusive-btn-label">All Things<br><span class="exclusive-description">(Worn Items)</span></span>
            </a>
        </div>

        <a class="back-btn" href="main.html">⬅ Back to Home</a>
    </div>
</body>
</html>
