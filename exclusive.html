<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Content</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .exclusive-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 25px;
        }

        .exclusive-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .exclusive-intro {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .exclusive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 35px 0;
        }

        .exclusive-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #c41e3a 0%, #a01730 100%);
            color: white;
            padding: 35px 25px;
            text-decoration: none;
            border-radius: 15px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(196, 30, 58, 0.2);
            border: none;
            cursor: pointer;
            gap: 12px;
            min-height: 180px;
            animation: fade-in-up 0.8s ease;
        }

        .exclusive-btn-icon {
            font-size: 2.8rem;
        }

        .exclusive-btn-label {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
        }

        .exclusive-btn-description {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
            font-weight: 400;
        }

        .exclusive-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(196, 30, 58, 0.3);
            background: linear-gradient(135deg, #a01730 0%, #8a1428 100%);
        }

        .exclusive-btn:active {
            transform: translateY(-2px);
        }

        .warning-notice {
            background: rgba(196, 30, 58, 0.08);
            border-left: 4px solid #c41e3a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            color: #c41e3a;
            font-size: 14px;
            line-height: 1.6;
            font-weight: 500;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .exclusive-container {
                padding: 30px 15px;
            }

            .exclusive-btn {
                padding: 30px 20px;
                min-height: 160px;
            }

            .exclusive-btn-icon {
                font-size: 2.2rem;
            }

            .exclusive-btn-label {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="exclusive-container">
        <h1>🔐 Exclusive Only</h1>
        <p class="exclusive-intro">Welcome to my exclusive 18+ content! Choose where you'd like to go 💋</p>

        <div class="warning-notice">
            ⚠️ By accessing these platforms, you confirm you are 18+ and consent to viewing adult content.
        </div>

        <div class="exclusive-grid">
            <a href="https://onlyfans.com/stormladyy" target="_blank" class="exclusive-btn">
                <span class="exclusive-btn-icon">🔞</span>
                <span class="exclusive-btn-label">OnlyFans<br><span class="exclusive-btn-description">(Paid Content)</span></span>
            </a>

            <a href="https://pantydeal.com/member/Stormlady" target="_blank" class="exclusive-btn">
                <span class="exclusive-btn-icon">💦</span>
                <span class="exclusive-btn-label">PantyDeal<br><span class="exclusive-btn-description">(Custom Wear)</span></span>
            </a>

            <a href="https://www.allthingsworn.com/profile/stormladyy" target="_blank" class="exclusive-btn">
                <span class="exclusive-btn-icon">👙</span>
                <span class="exclusive-btn-label">All Things Worn<br><span class="exclusive-btn-description">(Worn Items)</span></span>
            </a>
        </div>

        <a class="back-btn" href="main.html">⬅ Back to Home</a>
    </div>
</body>
</html>
