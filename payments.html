<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .payment-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 25px;
        }

        .payment-content h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .payment-intro {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .payment-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(196, 30, 58, 0.1);
            border: 2px solid rgba(196, 30, 58, 0.15);
            margin-bottom: 30px;
            animation: fade-in-up 0.8s ease;
        }

        .payment-section h2 {
            color: #c41e3a;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin: 0 0 25px 0;
            text-align: center;
            font-weight: 700;
        }

        .payment-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .payment-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #c41e3a 0%, #a01730 100%);
            color: white;
            padding: 16px 20px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(196, 30, 58, 0.2);
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .payment-btn-icon {
            font-size: 1.3rem;
        }

        .payment-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(196, 30, 58, 0.3);
            background: linear-gradient(135deg, #a01730 0%, #8a1428 100%);
        }

        .payment-btn:active {
            transform: translateY(-1px);
        }

        .tip-section-payment {
            background: linear-gradient(135deg, #fff9f7 0%, #fef5f1 100%);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(196, 30, 58, 0.1);
            border: 2px solid rgba(196, 30, 58, 0.15);
            animation: fade-in-up 0.8s ease 0.1s both;
        }

        .tip-section-payment h3 {
            color: #c41e3a;
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .tip-section-payment p {
            color: #666;
            font-size: 14px;
            margin: 8px 0;
            line-height: 1.5;
            font-weight: 300;
        }

        /* Stripe Buy Button Container */
        stripe-buy-button {
            pointer-events: auto !important;
            position: relative;
            z-index: 9999;
        }

        .stripe-container {
            margin: 20px 0;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .payment-content {
                padding: 30px 15px;
            }

            .payment-section,
            .tip-section-payment {
                padding: 25px 20px;
            }

            .payment-btn {
                padding: 14px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="payment-content">
        <h1>💖 Payment Methods</h1>
        <p class="payment-intro">Choose your favorite way to send me a tip or payment! All methods are secure 🎀</p>

        <!-- Direct Payment Methods -->
        <div class="payment-section">
            <h2>Direct Payments</h2>
            <div class="payment-grid">
                <a href="https://cash.app/sincereslm" target="_blank" class="payment-btn">
                    <span class="payment-btn-icon">💵</span>
                    CashApp
                </a>
                <a href="https://paypal.me/sincereSLM" target="_blank" class="payment-btn">
                    <span class="payment-btn-icon">🅿️</span>
                    PayPal
                </a>
                <a href="https://throne.com/stormlady" target="_blank" class="payment-btn">
                    <span class="payment-btn-icon">👑</span>
                    My Throne
                </a>
            </div>
        </div>

        <!-- Stripe Tips Section -->
        <div class="tip-section-payment">
            <h3>💳 Quick Stripe Tip</h3>
            <p>Send me a tip for tasks, DM access, or just to support me! 💕</p>
            <div class="stripe-container">
                <stripe-buy-button
                    buy-button-id="buy_btn_1STciPQHjWhRyFbGuyzuDZj1"
                    publishable-key="pk_live_51SRpRbQHjWhRyFbGmBXUYiOi1nqVr4iYMWcOVguB2PMMdKzGUYiqYN00586ZGFtkcSyKa40pykELTyILAaw8Fyvd00fm0TimSb"
                    style="pointer-events:auto;">
                </stripe-buy-button>
            </div>
            <script async src="https://js.stripe.com/v3/buy-button.js"></script>
        </div>

        <a class="back-btn" href="main.html">⬅ Back to Home</a>
    </div>
</body>
</html>
