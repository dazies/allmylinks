<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where I Promote</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <style>
        .promote-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 25px;
        }

        .promote-container h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        .promote-intro {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .feed-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(196, 30, 58, 0.1);
            border: 2px solid rgba(196, 30, 58, 0.15);
            overflow: visible;
            animation: fade-in-up 0.8s ease;
        }

        .feed-card h2 {
            color: #c41e3a;
            font-size: 1.6rem;
            font-family: 'Playfair Display', serif;
            margin: 0 0 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feed-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .feed-content {
            max-height: 500px;
            overflow-y: auto;
            border-radius: 12px;
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
        }

        .twitter-feed {
            overflow: visible !important;
        }

        .feed-link-btn {
            display: inline-block;
            background: linear-gradient(135deg, #c41e3a 0%, #a01730 100%);
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(196, 30, 58, 0.2);
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .feed-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(196, 30, 58, 0.3);
            background: linear-gradient(135deg, #a01730 0%, #8a1428 100%);
        }

        @media (max-width: 768px) {
            .feed-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .promote-container {
                padding: 30px 15px;
            }

            .feed-card {
                padding: 20px;
            }

            .feed-card h2 {
                font-size: 1.4rem;
            }
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="promote-container">
        <h1>🌟 Where I Promote</h1>
        <p class="promote-intro">Check out where I post my free content! Follow me for the latest updates and exclusive posts 💕</p>

        <div class="feed-grid">
            <!-- Twitter/X Feed -->
            <div class="feed-card">
                <h2><span class="feed-icon">𝕏</span> X (Twitter)</h2>
                <div class="feed-content twitter-feed">
                    <a class="twitter-timeline" data-height="450" href="https://x.com/stormladyy">Tweets by stormladyy</a>
                </div>
                <a href="https://x.com/stormladyy" target="_blank" class="feed-link-btn">Visit My X Profile →</a>
            </div>

            <!-- Reddit Feed -->
            <div class="feed-card">
                <h2><span class="feed-icon">🔴</span> Reddit</h2>
                <div class="feed-content reddit-embed">
                    <iframe src="https://www.reddit.com/user/storm-lady/new/.embed" width="100%" height="450" frameborder="0" scrolling="no" allow="web-share" style="border-radius: 12px;"></iframe>
                </div>
                <a href="https://www.reddit.com/user/storm-lady/" target="_blank" class="feed-link-btn">Visit My Reddit Profile →</a>
            </div>
        </div>

        <a class="back-btn" href="main.html">⬅ Back to Home</a>
    </div>
</body>
</html>
